# Example nginx front for an LLM gateway + modelinfod.
#
#   client ──> nginx ──┬── /v1/model/info, /model/info  ──> modelinfod (:8080)
#                      ├── /modelinfod, /modelinfod/*   ──> modelinfod (:8080)
#                      └── everything else (/v1/...)    ──> your LLM gateway (:4000)
#
# Drop into /etc/nginx/conf.d/ and adjust server_name + upstream ports.
# TLS is omitted here — terminate it in front (Cloudflare) or add your usual
# listen 443 ssl + certificate directives.

upstream modelinfod {
    server 127.0.0.1:8080;
    keepalive 8;
}

upstream llm_gateway {
    server 127.0.0.1:4000;   # litellm proxy / OpenAI-compatible gateway
    keepalive 16;
}

server {
    listen 80;
    server_name llm.example.com;

    # Public model metadata, served by modelinfod. Intentionally no auth here:
    # API keys are enforced by the gateway for inference; model info is not
    # sensitive. Exact-match locations win over the prefix locations below.
    location = /v1/model/info {
        proxy_pass http://modelinfod;
        include /etc/nginx/snippets/modelinfod-proxy.conf;
    }

    location = /model/info {
        proxy_pass http://modelinfod;
        include /etc/nginx/snippets/modelinfod-proxy.conf;
    }

    # Admin panel + admin API. Gate this: set ADMIN_TOKEN in modelinfod's .env,
    # and/or restrict at the proxy. Two common options:
    #
    #   allow 10.0.0.0/8; deny all;                  # private networks only
    #   auth_basic "modelinfod"; auth_basic_user_file /etc/nginx/.htpasswd;
    #
    # (With Cloudflare in front, prefer a Cloudflare Access policy instead —
    # see examples/cloudflared/.)
    location /modelinfod {
        proxy_pass http://modelinfod;
        include /etc/nginx/snippets/modelinfod-proxy.conf;
    }

    # Everything else: the actual LLM gateway (chat/completions, embeddings,
    # /v1/models, ...). Streaming-friendly settings: SSE responses must not
    # be buffered.
    location / {
        proxy_pass http://llm_gateway;
        include /etc/nginx/snippets/modelinfod-proxy.conf;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;       # long generations / streamed responses
        client_max_body_size 50m;     # base64 images in chat requests
    }
}
